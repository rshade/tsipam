# release-please owns the vX.Y.Z tag, changelog and GitHub Release object; the
# release workflow builds with `--skip=publish`, smoke-tests dist/, and attaches
# it to that release with `gh release upload`.
# Local smoke test: `mise run release-check` or `mise run smoke-release`.
version: 2

project_name: tsipam

before:
  hooks:
    # The archives' NOTICE carries the inventory of linked third-party modules,
    # generated from go.mod so dependency bumps cannot leave it stale.
    - scripts/notice.sh .release/NOTICE

builds:
  - id: tsipam
    main: ./cmd/tsipam
    binary: tsipam
    env:
      - CGO_ENABLED=0
    # Telemetry never leaves the machine, so the exporters that could send it are
    # left out. scripts/notice.sh lists modules with the same tags.
    tags:
      - ax_no_grpc
      - ax_no_otlp
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - src: .release/NOTICE
        strip_parent: true

checksum:
  name_template: checksums.txt

changelog:
  disable: true
