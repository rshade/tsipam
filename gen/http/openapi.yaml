swagger: "2.0"
info:
    title: tail-ipam address-space registry API
    description: Plans and allocates Tailscale address space through 4via6 site IDs, subnet CIDR pools, per-service IPv4 addresses, and per-device UDP listen ports. Paths are tailnet-scoped (/tailnet/{tailnet}/ipam/...) to mirror Tailscale's own control-plane API convention.
    version: 0.0.1
host: localhost:80
consumes:
    - application/json
    - application/xml
    - application/gob
produces:
    - application/json
    - application/xml
    - application/gob
paths:
    /tailnet/{tailnet}/ipam/plan:
        get:
            tags:
                - ipam
            summary: plan ipam
            description: Compare declared allocations with live control-plane state without modifying either.
            operationId: ipam#plan
            parameters:
                - name: live_tailnet
                  in: query
                  description: Tailscale tailnet whose live allocations are collected.
                  required: true
                  type: string
                - name: tailnet
                  in: path
                  description: Routing/storage key for the registry.
                  required: true
                  type: string
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/ComparisonReport'
                        required:
                            - live_tailnet
                            - drift_count
                            - entries
                            - excluded
                "502":
                    description: Bad Gateway response.
                    schema:
                        $ref: '#/definitions/IpamPlanComparisonFailedResponseBody'
            schemes:
                - http
    /tailnet/{tailnet}/ipam/service-addresses:
        get:
            tags:
                - ipam
            summary: list_service_addresses ipam
            operationId: ipam#list_service_addresses
            parameters:
                - name: tailnet
                  in: path
                  description: Routing/storage key for the registry. May be a synthetic alias, not necessarily the live Tailscale tailnet name.
                  required: true
                  type: string
            responses:
                "200":
                    description: OK response.
                    schema:
                        type: array
                        items:
                            $ref: '#/definitions/ServiceAddressReservation'
            schemes:
                - http
        post:
            tags:
                - ipam
            summary: reserve_service_address ipam
            operationId: ipam#reserve_service_address
            parameters:
                - name: tailnet
                  in: path
                  description: Routing/storage key for the registry.
                  required: true
                  type: string
                - name: reserve_service_address_request_body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/IpamReserveServiceAddressRequestBody'
                    required:
                        - address
                        - service
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/IpamReserveServiceAddressResponseBody'
                        required:
                            - address
                            - service
                            - changed
                "400":
                    description: Bad Request response.
                    schema:
                        $ref: '#/definitions/IpamReserveServiceAddressInvalidInputResponseBody'
                "409":
                    description: Conflict response.
                    schema:
                        $ref: '#/definitions/IpamReserveServiceAddressCollisionResponseBody'
            schemes:
                - http
        delete:
            tags:
                - ipam
            summary: release_service_address ipam
            operationId: ipam#release_service_address
            parameters:
                - name: address
                  in: query
                  description: Bare IPv4 host or exact IPv4 /32 prefix to release.
                  required: true
                  type: string
                - name: tailnet
                  in: path
                  description: Routing/storage key for the registry.
                  required: true
                  type: string
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/IpamReleaseServiceAddressResponseBody'
                        required:
                            - address
                            - changed
                "400":
                    description: Bad Request response.
                    schema:
                        $ref: '#/definitions/IpamReleaseServiceAddressInvalidInputResponseBody'
            schemes:
                - http
    /tailnet/{tailnet}/ipam/site-ids:
        get:
            tags:
                - ipam
            summary: list_site_ids ipam
            operationId: ipam#list_site_ids
            parameters:
                - name: tailnet
                  in: path
                  description: Routing/storage key for the registry. May be a synthetic alias, not necessarily the live Tailscale tailnet name.
                  required: true
                  type: string
            responses:
                "200":
                    description: OK response.
                    schema:
                        type: array
                        items:
                            $ref: '#/definitions/SiteIDReservation'
            schemes:
                - http
        post:
            tags:
                - ipam
            summary: reserve_site_id ipam
            operationId: ipam#reserve_site_id
            parameters:
                - name: tailnet
                  in: path
                  description: Routing/storage key for the registry.
                  required: true
                  type: string
                - name: reserve_site_id_request_body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/IpamReserveSiteIDRequestBody'
                    required:
                        - id
                        - site
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/IpamReserveSiteIDResponseBody'
                        required:
                            - id
                            - site
                            - changed
                "400":
                    description: Bad Request response.
                    schema:
                        $ref: '#/definitions/IpamReserveSiteIDInvalidInputResponseBody'
                "409":
                    description: Conflict response.
                    schema:
                        $ref: '#/definitions/IpamReserveSiteIDCollisionResponseBody'
            schemes:
                - http
    /tailnet/{tailnet}/ipam/site-ids/{id}:
        delete:
            tags:
                - ipam
            summary: release_site_id ipam
            operationId: ipam#release_site_id
            parameters:
                - name: tailnet
                  in: path
                  description: Routing/storage key for the registry.
                  required: true
                  type: string
                - name: id
                  in: path
                  description: 4via6 site ID to release.
                  required: true
                  type: string
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/IpamReleaseSiteIDResponseBody'
                        required:
                            - id
                            - changed
                "400":
                    description: Bad Request response.
                    schema:
                        $ref: '#/definitions/IpamReleaseSiteIDInvalidInputResponseBody'
            schemes:
                - http
    /tailnet/{tailnet}/ipam/subnet-pools:
        get:
            tags:
                - ipam
            summary: list_subnet_pools ipam
            operationId: ipam#list_subnet_pools
            parameters:
                - name: tailnet
                  in: path
                  description: Routing/storage key for the registry. May be a synthetic alias, not necessarily the live Tailscale tailnet name.
                  required: true
                  type: string
            responses:
                "200":
                    description: OK response.
                    schema:
                        type: array
                        items:
                            $ref: '#/definitions/SubnetPoolReservation'
            schemes:
                - http
        post:
            tags:
                - ipam
            summary: reserve_subnet_pool ipam
            operationId: ipam#reserve_subnet_pool
            parameters:
                - name: tailnet
                  in: path
                  description: Routing/storage key for the registry.
                  required: true
                  type: string
                - name: reserve_subnet_pool_request_body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/IpamReserveSubnetPoolRequestBody'
                    required:
                        - cidr
                        - site
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/IpamReserveSubnetPoolResponseBody'
                        required:
                            - cidr
                            - site
                            - changed
                "400":
                    description: Bad Request response.
                    schema:
                        $ref: '#/definitions/IpamReserveSubnetPoolInvalidInputResponseBody'
                "409":
                    description: Conflict response.
                    schema:
                        $ref: '#/definitions/IpamReserveSubnetPoolCollisionResponseBody'
            schemes:
                - http
        delete:
            tags:
                - ipam
            summary: release_subnet_pool ipam
            operationId: ipam#release_subnet_pool
            parameters:
                - name: cidr
                  in: query
                  description: Canonical IPv4 or IPv6 CIDR prefix to release.
                  required: true
                  type: string
                - name: tailnet
                  in: path
                  description: Routing/storage key for the registry.
                  required: true
                  type: string
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/IpamReleaseSubnetPoolResponseBody'
                        required:
                            - cidr
                            - changed
                "400":
                    description: Bad Request response.
                    schema:
                        $ref: '#/definitions/IpamReleaseSubnetPoolInvalidInputResponseBody'
            schemes:
                - http
    /tailnet/{tailnet}/ipam/udp-ports:
        get:
            tags:
                - ipam
            summary: list_udp_ports ipam
            operationId: ipam#list_udp_ports
            parameters:
                - name: site
                  in: query
                  description: 'Optional site/firewall-boundary label to filter. An absent or empty site parameter means no filter: returns reservations from all sites.'
                  required: false
                  type: string
                - name: tailnet
                  in: path
                  description: Routing/storage key for the registry. May be a synthetic alias, not necessarily the live Tailscale tailnet name.
                  required: true
                  type: string
            responses:
                "200":
                    description: OK response.
                    schema:
                        type: array
                        items:
                            $ref: '#/definitions/UDPPortReservation'
                "400":
                    description: Bad Request response.
                    schema:
                        $ref: '#/definitions/IpamListUDPPortsInvalidInputResponseBody'
            schemes:
                - http
        post:
            tags:
                - ipam
            summary: reserve_udp_port ipam
            operationId: ipam#reserve_udp_port
            parameters:
                - name: tailnet
                  in: path
                  description: Routing/storage key for the registry.
                  required: true
                  type: string
                - name: reserve_udp_port_request_body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/IpamReserveUDPPortRequestBody'
                    required:
                        - site
                        - port
                        - device
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/IpamReserveUDPPortResponseBody'
                        required:
                            - site
                            - port
                            - device
                            - changed
                "400":
                    description: Bad Request response.
                    schema:
                        $ref: '#/definitions/IpamReserveUDPPortInvalidInputResponseBody'
                "409":
                    description: Conflict response.
                    schema:
                        $ref: '#/definitions/IpamReserveUDPPortCollisionResponseBody'
            schemes:
                - http
        delete:
            tags:
                - ipam
            summary: release_udp_port ipam
            operationId: ipam#release_udp_port
            parameters:
                - name: site
                  in: query
                  description: Site/firewall-boundary label containing the reservation.
                  required: true
                  type: string
                - name: port
                  in: query
                  description: Decimal UDP listen port to release, 1024-65535.
                  required: true
                  type: string
                - name: tailnet
                  in: path
                  description: Routing/storage key for the registry.
                  required: true
                  type: string
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/IpamReleaseUDPPortResponseBody'
                        required:
                            - site
                            - port
                            - changed
                "400":
                    description: Bad Request response.
                    schema:
                        $ref: '#/definitions/IpamReleaseUDPPortInvalidInputResponseBody'
            schemes:
                - http
