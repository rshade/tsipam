openapi: 3.2.0
info:
    title: tail-ipam address-space registry API
    description: Plans and allocates Tailscale address space through 4via6 site IDs and subnet CIDR pools. Paths are tailnet-scoped (/tailnet/{tailnet}/ipam/...) to mirror Tailscale's own control-plane API convention.
    version: 0.0.1
servers:
    - url: http://localhost:80
      name: tail-ipam
      description: Default server for tail-ipam
paths:
    /tailnet/{tailnet}/ipam/site-ids:
        get:
            tags:
                - ipam
            summary: list_site_ids ipam
            operationId: ipam#list_site_ids
            parameters:
                - name: tailnet
                  in: path
                  description: Routing/storage key for the registry. May be a synthetic alias, not necessarily the live Tailscale tailnet name.
                  required: true
                  schema:
                    type: string
                    description: Routing/storage key for the registry. May be a synthetic alias, not necessarily the live Tailscale tailnet name.
                    example: Quia suscipit itaque rem eligendi atque.
                  example: Consequatur officia aspernatur ut.
            responses:
                "200":
                    description: OK response.
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/SiteIDReservation'
                                example:
                                    - description: Maxime porro rerum illum sed dicta.
                                      id: Est assumenda quibusdam.
                                      owner: Similique labore.
                                      reserved_at: "2001-11-05T19:55:55Z"
                                      site: Nobis id rerum fugit eum.
                                      ticket: Eum voluptatem consequatur in voluptatibus.
                                    - description: Maxime porro rerum illum sed dicta.
                                      id: Est assumenda quibusdam.
                                      owner: Similique labore.
                                      reserved_at: "2001-11-05T19:55:55Z"
                                      site: Nobis id rerum fugit eum.
                                      ticket: Eum voluptatem consequatur in voluptatibus.
                                    - description: Maxime porro rerum illum sed dicta.
                                      id: Est assumenda quibusdam.
                                      owner: Similique labore.
                                      reserved_at: "2001-11-05T19:55:55Z"
                                      site: Nobis id rerum fugit eum.
                                      ticket: Eum voluptatem consequatur in voluptatibus.
                            example:
                                - description: Maxime porro rerum illum sed dicta.
                                  id: Est assumenda quibusdam.
                                  owner: Similique labore.
                                  reserved_at: "2001-11-05T19:55:55Z"
                                  site: Nobis id rerum fugit eum.
                                  ticket: Eum voluptatem consequatur in voluptatibus.
                                - description: Maxime porro rerum illum sed dicta.
                                  id: Est assumenda quibusdam.
                                  owner: Similique labore.
                                  reserved_at: "2001-11-05T19:55:55Z"
                                  site: Nobis id rerum fugit eum.
                                  ticket: Eum voluptatem consequatur in voluptatibus.
                                - description: Maxime porro rerum illum sed dicta.
                                  id: Est assumenda quibusdam.
                                  owner: Similique labore.
                                  reserved_at: "2001-11-05T19:55:55Z"
                                  site: Nobis id rerum fugit eum.
                                  ticket: Eum voluptatem consequatur in voluptatibus.
        post:
            tags:
                - ipam
            summary: reserve_site_id ipam
            operationId: ipam#reserve_site_id
            parameters:
                - name: tailnet
                  in: path
                  description: Routing/storage key for the registry.
                  required: true
                  schema:
                    type: string
                    description: Routing/storage key for the registry.
                    example: Voluptatum facilis suscipit magni.
                  example: Qui et earum vero voluptate et.
            requestBody:
                description: Request body for reserve_site_id.
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SiteIDReservation'
                        example:
                            description: Ratione est omnis at voluptatem explicabo qui.
                            id: Qui repudiandae in hic et porro quas.
                            owner: Eum fugit inventore sit.
                            reserved_at: "1984-12-10T06:42:10Z"
                            site: Aliquid facere.
                            ticket: Culpa magni cum omnis.
            responses:
                "200":
                    description: OK response.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ReserveSiteIDResponseBody'
                            example:
                                changed: true
                                description: Dolor sed tempore suscipit qui id provident.
                                id: Occaecati accusamus nobis asperiores.
                                owner: Quisquam a ut dignissimos.
                                reserved_at: "1976-01-14T22:54:54Z"
                                site: Quod qui autem.
                                ticket: Voluptatem sed quo corporis asperiores corrupti.
                "409":
                    description: 'collision: id is already reserved for a different site.'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
    /tailnet/{tailnet}/ipam/site-ids/{id}:
        delete:
            tags:
                - ipam
            summary: release_site_id ipam
            operationId: ipam#release_site_id
            parameters:
                - name: tailnet
                  in: path
                  description: Routing/storage key for the registry.
                  required: true
                  schema:
                    type: string
                    description: Routing/storage key for the registry.
                    example: Repellat eius voluptatibus qui.
                  example: Repudiandae eum consequatur deserunt quisquam.
                - name: id
                  in: path
                  description: 4via6 site ID to release.
                  required: true
                  schema:
                    type: string
                    description: 4via6 site ID to release.
                    example: Quo asperiores sit sit.
                  example: Explicabo qui fugit earum assumenda quia.
            responses:
                "200":
                    description: OK response.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ReleaseSiteIDResponseBody'
                            example:
                                changed: false
                                id: Cupiditate doloremque unde in.
    /tailnet/{tailnet}/ipam/subnet-pools:
        delete:
            tags:
                - ipam
            summary: release_subnet_pool ipam
            operationId: ipam#release_subnet_pool
            parameters:
                - name: cidr
                  in: query
                  description: Canonical IPv4 or IPv6 CIDR prefix to release.
                  allowEmptyValue: true
                  required: true
                  schema:
                    type: string
                    description: Canonical IPv4 or IPv6 CIDR prefix to release.
                    example: Dolores repellendus tempora hic adipisci sapiente cumque.
                  example: Quasi explicabo.
                - name: tailnet
                  in: path
                  description: Routing/storage key for the registry.
                  required: true
                  schema:
                    type: string
                    description: Routing/storage key for the registry.
                    example: Sint consequatur consequuntur.
                  example: Ipsam nesciunt velit ipsa exercitationem eveniet earum.
            responses:
                "200":
                    description: OK response.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ReleaseSubnetPoolResponseBody'
                            example:
                                changed: true
                                cidr: Veniam eius ut illum pariatur.
        get:
            tags:
                - ipam
            summary: list_subnet_pools ipam
            operationId: ipam#list_subnet_pools
            parameters:
                - name: tailnet
                  in: path
                  description: Routing/storage key for the registry. May be a synthetic alias, not necessarily the live Tailscale tailnet name.
                  required: true
                  schema:
                    type: string
                    description: Routing/storage key for the registry. May be a synthetic alias, not necessarily the live Tailscale tailnet name.
                    example: Enim dolores voluptates aut necessitatibus.
                  example: Nulla molestiae est inventore inventore perspiciatis.
            responses:
                "200":
                    description: OK response.
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/SubnetPoolReservation'
                                example:
                                    - cidr: Sit corrupti dolorem harum voluptatum.
                                      description: Aperiam cumque minus aut illum non suscipit.
                                      owner: Recusandae quaerat.
                                      reserved_at: "1997-03-26T19:38:02Z"
                                      site: Sit nulla recusandae perspiciatis sit saepe.
                                      ticket: Hic corporis.
                                    - cidr: Sit corrupti dolorem harum voluptatum.
                                      description: Aperiam cumque minus aut illum non suscipit.
                                      owner: Recusandae quaerat.
                                      reserved_at: "1997-03-26T19:38:02Z"
                                      site: Sit nulla recusandae perspiciatis sit saepe.
                                      ticket: Hic corporis.
                            example:
                                - cidr: Sit corrupti dolorem harum voluptatum.
                                  description: Aperiam cumque minus aut illum non suscipit.
                                  owner: Recusandae quaerat.
                                  reserved_at: "1997-03-26T19:38:02Z"
                                  site: Sit nulla recusandae perspiciatis sit saepe.
                                  ticket: Hic corporis.
                                - cidr: Sit corrupti dolorem harum voluptatum.
                                  description: Aperiam cumque minus aut illum non suscipit.
                                  owner: Recusandae quaerat.
                                  reserved_at: "1997-03-26T19:38:02Z"
                                  site: Sit nulla recusandae perspiciatis sit saepe.
                                  ticket: Hic corporis.
        post:
            tags:
                - ipam
            summary: reserve_subnet_pool ipam
            operationId: ipam#reserve_subnet_pool
            parameters:
                - name: tailnet
                  in: path
                  description: Routing/storage key for the registry.
                  required: true
                  schema:
                    type: string
                    description: Routing/storage key for the registry.
                    example: Explicabo dolor est voluptate dolores nesciunt.
                  example: Aspernatur dolor et ullam quis debitis.
            requestBody:
                description: Request body for reserve_subnet_pool.
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SubnetPoolReservation'
                        example:
                            cidr: Iste voluptatem modi aut id illum rerum.
                            description: Eos et nesciunt aperiam molestiae iusto quia.
                            owner: Consequuntur facilis.
                            reserved_at: "1999-05-20T14:51:36Z"
                            site: Occaecati assumenda quia.
                            ticket: Qui labore facilis deleniti.
            responses:
                "200":
                    description: OK response.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ReserveSubnetPoolResponseBody'
                            example:
                                changed: false
                                cidr: Est dolor.
                                description: Et corporis iste.
                                owner: Est dolorem accusantium commodi.
                                reserved_at: "2009-01-30T14:45:12Z"
                                site: Et voluptatem sit iusto.
                                ticket: Necessitatibus impedit ducimus facere quas.
                "409":
                    description: 'collision: cidr overlaps a subnet pool reserved for a different site.'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
components:
    schemas:
        Error:
            type: object
            properties:
                fault:
                    type: boolean
                    description: Is the error a server-side fault?
                    example: true
                id:
                    type: string
                    description: ID is a unique identifier for this particular occurrence of the problem.
                    example: 123abc
                message:
                    type: string
                    description: Message is a human-readable explanation specific to this occurrence of the problem.
                    example: parameter 'p' must be an integer
                name:
                    type: string
                    description: Name is the name of this class of errors.
                    example: bad_request
                temporary:
                    type: boolean
                    description: Is the error temporary?
                    example: false
                timeout:
                    type: boolean
                    description: Is the error a timeout?
                    example: false
            description: id is already reserved for a different site.
            example:
                fault: true
                id: 123abc
                message: parameter 'p' must be an integer
                name: bad_request
                temporary: false
                timeout: false
            required:
                - name
                - id
                - message
                - temporary
                - timeout
                - fault
        ReleaseSiteIDResponseBody:
            type: object
            properties:
                changed:
                    type: boolean
                    description: False when id was not reserved.
                    example: false
                id:
                    type: string
                    description: Canonical site ID released.
                    example: Cupiditate doloremque unde in.
            example:
                changed: false
                id: Cupiditate doloremque unde in.
            required:
                - id
                - changed
        ReleaseSubnetPoolResponseBody:
            type: object
            properties:
                changed:
                    type: boolean
                    description: False when cidr was not reserved.
                    example: true
                cidr:
                    type: string
                    description: Canonical subnet CIDR released.
                    example: Veniam eius ut illum pariatur.
            example:
                changed: true
                cidr: Veniam eius ut illum pariatur.
            required:
                - cidr
                - changed
        ReserveSiteIDResponseBody:
            type: object
            properties:
                changed:
                    type: boolean
                    description: False when the exact id+site pair and metadata were already reserved.
                    example: true
                description:
                    type: string
                    description: Free-text description of why this address space is reserved.
                    example: Dolor sed tempore suscipit qui id provident.
                id:
                    type: string
                    description: Canonical site ID actually written.
                    example: Occaecati accusamus nobis asperiores.
                owner:
                    type: string
                    description: Operator or team that owns this reservation.
                    example: Quisquam a ut dignissimos.
                reserved_at:
                    type: string
                    description: RFC 3339 timestamp this reservation's metadata was recorded.
                    example: "1976-01-14T22:54:54Z"
                    format: date-time
                site:
                    type: string
                    description: Canonical site name actually written.
                    example: Quod qui autem.
                ticket:
                    type: string
                    description: Tracking ticket or issue reference for this reservation.
                    example: Voluptatem sed quo corporis asperiores corrupti.
            example:
                changed: true
                description: Dolor sed tempore suscipit qui id provident.
                id: Occaecati accusamus nobis asperiores.
                owner: Quisquam a ut dignissimos.
                reserved_at: "1976-01-14T22:54:54Z"
                site: Quod qui autem.
                ticket: Voluptatem sed quo corporis asperiores corrupti.
            required:
                - id
                - site
                - changed
        ReserveSubnetPoolResponseBody:
            type: object
            properties:
                changed:
                    type: boolean
                    description: False when the exact CIDR, site, and metadata were already reserved.
                    example: false
                cidr:
                    type: string
                    description: Canonical subnet CIDR actually written.
                    example: Est dolor.
                description:
                    type: string
                    description: Free-text description of why this address space is reserved.
                    example: Et corporis iste.
                owner:
                    type: string
                    description: Operator or team that owns this reservation.
                    example: Est dolorem accusantium commodi.
                reserved_at:
                    type: string
                    description: RFC 3339 timestamp this reservation's metadata was recorded.
                    example: "2009-01-30T14:45:12Z"
                    format: date-time
                site:
                    type: string
                    description: Canonical site name actually written.
                    example: Et voluptatem sit iusto.
                ticket:
                    type: string
                    description: Tracking ticket or issue reference for this reservation.
                    example: Necessitatibus impedit ducimus facere quas.
            example:
                changed: false
                cidr: Est dolor.
                description: Et corporis iste.
                owner: Est dolorem accusantium commodi.
                reserved_at: "2009-01-30T14:45:12Z"
                site: Et voluptatem sit iusto.
                ticket: Necessitatibus impedit ducimus facere quas.
            required:
                - cidr
                - site
                - changed
        SiteIDReservation:
            type: object
            properties:
                description:
                    type: string
                    description: Free-text description of why this address space is reserved.
                    example: Maxime porro rerum illum sed dicta.
                id:
                    type: string
                    description: 'Canonical site ID: a decimal integer, 0-65535.'
                    example: Est assumenda quibusdam.
                owner:
                    type: string
                    description: Operator or team that owns this reservation.
                    example: Similique labore.
                reserved_at:
                    type: string
                    description: RFC 3339 timestamp this reservation's metadata was recorded.
                    example: "2001-11-05T19:55:55Z"
                    format: date-time
                site:
                    type: string
                    description: Site name reserved for this ID.
                    example: Nobis id rerum fugit eum.
                ticket:
                    type: string
                    description: Tracking ticket or issue reference for this reservation.
                    example: Eum voluptatem consequatur in voluptatibus.
            description: A reserved 4via6 site ID.
            example:
                description: Maxime porro rerum illum sed dicta.
                id: Est assumenda quibusdam.
                owner: Similique labore.
                reserved_at: "2001-11-05T19:55:55Z"
                site: Nobis id rerum fugit eum.
                ticket: Eum voluptatem consequatur in voluptatibus.
            required:
                - id
                - site
        SubnetPoolReservation:
            type: object
            properties:
                cidr:
                    type: string
                    description: Canonical IPv4 or IPv6 CIDR prefix.
                    example: Sit corrupti dolorem harum voluptatum.
                description:
                    type: string
                    description: Free-text description of why this address space is reserved.
                    example: Aperiam cumque minus aut illum non suscipit.
                owner:
                    type: string
                    description: Operator or team that owns this reservation.
                    example: Recusandae quaerat.
                reserved_at:
                    type: string
                    description: RFC 3339 timestamp this reservation's metadata was recorded.
                    example: "1997-03-26T19:38:02Z"
                    format: date-time
                site:
                    type: string
                    description: Site name reserved for this subnet pool.
                    example: Sit nulla recusandae perspiciatis sit saepe.
                ticket:
                    type: string
                    description: Tracking ticket or issue reference for this reservation.
                    example: Hic corporis.
            description: A subnet CIDR pool reserved for a site.
            example:
                cidr: Sit corrupti dolorem harum voluptatum.
                description: Aperiam cumque minus aut illum non suscipit.
                owner: Recusandae quaerat.
                reserved_at: "1997-03-26T19:38:02Z"
                site: Sit nulla recusandae perspiciatis sit saepe.
                ticket: Hic corporis.
            required:
                - cidr
                - site
tags:
    - name: ipam
      description: Reserve, release, and list address-space allocations for one tailnet's registry.
