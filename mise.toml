# Single source of truth for tool versions and project commands: local dev and
# CI both read the pins and run the tasks from here (`mise run <task>`).
[tools]
go = "1.27.4"
golangci-lint = "2.15.0"
goreleaser = "2.20.3"
actionlint = "1.7.12"
gitleaks = "8.30.1"
jq = "1.8.2"
trufflehog = "3.100.1"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.10.0"
"go:github.com/google/go-licenses/v2" = "2.0.1"
# goa generates gen/ from design/. Keep it on the goa.design/goa/v3 version in
# go.mod: gen-check fails when the committed gen/ differs from this generator's
# output.
"go:goa.design/goa/v3/cmd/goa" = "3.35.0"
# Node only provides the npm backend for the CLIs below.
node = "26"
"npm:markdownlint-cli" = "0.50.1"
# @commitlint/config-conventional installs nested inside the CLI, so
# commitlint.config.js extends it without a second pin.
"npm:@commitlint/cli" = "21.2.4"
# The OpenSpec CLI behind the openspec/ workflow and the Copilot setup steps.
"npm:@fission-ai/openspec" = "2.2.0"

[tasks.lint]
description = "Run every check"
depends = ["lint-go", "fmt-check", "tidy-check", "go-version-check", "gen-check", "lint-md", "lint-actions", "lint-commit", "govulncheck", "license-check", "scan-secrets"]

[tasks.build]
description = "Build every package"
run = "go build ./..."

[tasks.test]
description = "Run the full test suite"
run = "go test ./..."

[tasks.vet]
description = "go vet, including the smoke build tag"
shell = "bash -euo pipefail -c"
run = '''
go vet ./...
go vet -tags smoke ./...
'''

[tasks.cross]
description = "Cross-compile for every released OS"
shell = "bash -euo pipefail -c"
run = '''
for os in linux darwin windows; do
  echo "==> GOOS=$os"
  GOOS=$os GOARCH=amd64 go build ./...
done
'''

[tasks.lint-go]
description = "golangci-lint"
run = "golangci-lint run ./..."

[tasks.fmt-check]
description = "Fail if any file is not gofmt -s clean"
shell = "bash -euo pipefail -c"
run = '''
out=$(gofmt -s -l .)
if [ -n "$out" ]; then
  echo "gofmt -s needed:" >&2
  echo "$out" >&2
  exit 1
fi
'''

[tasks.tidy-check]
description = "Fail if go mod tidy would change go.mod or go.sum"
shell = "bash -euo pipefail -c"
run = '''
go mod tidy
git diff --exit-code -- go.mod go.sum
'''

[tasks.go-version-check]
description = "Fail if the go directive in go.mod differs from the mise pin"
shell = "bash -euo pipefail -c"
run = '''
want=$(mise current go)
have=$(awk '/^go /{print $2; exit}' go.mod)
if [ "$want" != "$have" ]; then
  echo "go.mod says go $have, mise.toml pins $want" >&2
  exit 1
fi
'''

[tasks.gen]
description = "Regenerate gen/ from design/ with goa"
shell = "bash -euo pipefail -c"
run = '''
goa gen github.com/rshade/tsipam/design
go mod tidy
'''

[tasks.gen-check]
description = "Fail if goa gen would change the committed gen/"
shell = "bash -euo pipefail -c"
run = '''
# goa gen writes a temporary goa<N>/ main package and indirect requires into the
# module it runs in. Generating into a scratch copy keeps this checkout untouched,
# so the lint tasks running beside this one never see a half-generated module.
scratch=$(mktemp -d)
trap 'rm -rf "$scratch"' EXIT
mkdir "$scratch/module" "$scratch/committed"
cp go.mod go.sum "$scratch/module/"
cp -R design "$scratch/module/design"
(cd "$scratch/module" && goa gen github.com/rshade/tsipam/design >/dev/null)
# The index must match goa gen's output, so a staged regeneration passes locally.
# The work tree must match the index by git's rules (modes and symlinks count,
# ignored files do not), so an unstaged edit under gen/ cannot reach
# git commit -a.
git ls-files -z -- gen | git checkout-index -z --stdin --prefix="$scratch/committed/"
drift=$(
  {
    diff -rq "$scratch/committed/gen" "$scratch/module/gen" | sed 's#^#index: #' || true
    git diff --name-status -- gen | sed 's#^#work tree: #' || true
    git ls-files --others --exclude-standard -- gen | sed 's#^#work tree: untracked #' || true
  } 2>&1 | sed "s#$scratch/committed/##g; s#$scratch/module/#generated #g"
)
if [ -n "$drift" ]; then
  echo "gen/ differs from goa gen output; run mise run gen and commit the result:" >&2
  echo "$drift" >&2
  exit 1
fi
'''

# go-licenses cannot classify a module that ships no license file, such as
# jaxxstorm/vers (a tscli dependency, Apache-2.0 per its README). Each one is
# listed as scripts/license-exceptions/<module path>.txt, which also supplies the
# text scripts/notice.sh ships for it; delete the file once upstream adds a
# license.
[tasks.license-check]
description = "Fail on a dependency outside the license allowlist"
shell = "bash -euo pipefail -c"
run = '''
ignore=$(cd scripts/license-exceptions && find . -type f -name '*.txt' | sed -e 's#^\./##' -e 's#\.txt$##' | LC_ALL=C sort | paste -sd, -)
args=()
if [ -n "$ignore" ]; then
  args=(--ignore "$ignore")
fi
go-licenses check ./... "${args[@]}" --allowed_licenses=MIT,Apache-2.0,BSD-2-Clause,BSD-3-Clause,ISC,MPL-2.0
'''

[tasks.notice]
description = "Write the release NOTICE, with the dependency inventory, to .release/NOTICE"
run = "scripts/notice.sh .release/NOTICE"

[tasks.release-check]
description = "Validate .goreleaser.yaml and build a snapshot"
shell = "bash -euo pipefail -c"
run = '''
goreleaser check
goreleaser release --snapshot --clean --skip=publish
'''

[tasks.smoke]
description = "Release smoke suite (TSIPAM_SMOKE_BINARY, TSIPAM_SMOKE_DIST, TSIPAM_SMOKE_LIVE=1 optional)"
shell = "bash -euo pipefail -c"
run = '''
# go test runs the suite from smoke/, so resolve relative paths here.
for var in TSIPAM_SMOKE_BINARY TSIPAM_SMOKE_DIST; do
  value=${!var:-}
  if [ -n "$value" ] && [ "${value#/}" = "$value" ]; then
    export "$var=$PWD/$value"
  fi
done
go test -tags smoke -count=1 ./smoke
'''

[tasks.smoke-live]
description = "Live smoke cases against a real tailnet (needs TAILSCALE_API_KEY and TAILSCALE_TAILNET); fails if none passed"
shell = "bash -euo pipefail -c"
run = '''
: "${TAILSCALE_API_KEY:?set TAILSCALE_API_KEY (read-only key) for the live smoke cases}"
: "${TAILSCALE_TAILNET:?set TAILSCALE_TAILNET for the live smoke cases}"
log=$(mktemp)
trap 'rm -f "$log"' EXIT
rc=0
TSIPAM_SMOKE_LIVE=1 go test -tags smoke -count=1 -v -run '^TestLive' ./smoke 2>&1 | tee "$log" || rc=$?
passed=$(grep -c '^--- PASS: TestLive' "$log" || true)
skipped=$(grep -c '^--- SKIP: TestLive' "$log" || true)
echo "live smoke: $passed passed, $skipped skipped"
if [ "$rc" -ne 0 ]; then
  echo "live smoke failed" >&2
  exit 1
fi
# Every case skipping (missing data on the tailnet) would otherwise pass while
# proving nothing.
if [ "$passed" -eq 0 ]; then
  echo "no live smoke test passed, so the run proved nothing" >&2
  exit 1
fi
'''

[tasks.release-build]
description = "Build the release archives for the tag at HEAD into dist/ without publishing"
run = "goreleaser release --clean --skip=publish"

[tasks.smoke-release]
description = "Build release archives on HEAD as SMOKE_TAG (default v0.0.0-smoke) and smoke-test them"
shell = "bash -euo pipefail -c"
run = '''
tag=${SMOKE_TAG:-v0.0.0-smoke}
if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
  echo "tag $tag already exists; choose another SMOKE_TAG" >&2
  exit 1
fi
git -c tag.gpgSign=false -c tag.forceSignAnnotated=false tag "$tag" HEAD
trap 'git tag -d "$tag" >/dev/null' EXIT
mise run release-build
TSIPAM_SMOKE_DIST="$PWD/dist" mise run smoke
'''

[tasks.lint-md]
description = "markdownlint all authored markdown"
run = "markdownlint '**/*.md'"

[tasks.lint-actions]
description = "actionlint the GitHub workflows"
run = "actionlint"

[tasks.lint-commit]
description = "commitlint the branch (COMMIT_FROM/COMMIT_TO override the range)"
shell = "bash -euo pipefail -c"
run = 'commitlint --from "${COMMIT_FROM:-$(git merge-base HEAD origin/main)}" --to "${COMMIT_TO:-HEAD}" --verbose'

[tasks.govulncheck]
description = "Scan Go dependencies for known vulnerabilities"
# vuln.go.dev resets connections now and then. govulncheck exits 3 when it finds
# vulnerabilities, which must fail at once; any other failure is retried. errexit
# does not end the loop early: govulncheck runs on the left of &&.
shell = "bash -euo pipefail -c"
run = '''
for attempt in 1 2 3; do
  govulncheck ./... && exit 0
  status=$?
  [ "$status" = 3 ] && exit 3
  [ "$attempt" = 3 ] || { echo "govulncheck failed (attempt $attempt); retrying" >&2; sleep $((attempt * 10)); }
done
exit 1
'''

[tasks.scan-secrets]
description = "Run both secret scanners"
depends = ["scan-gitleaks", "scan-trufflehog"]

[tasks.scan-gitleaks]
description = "gitleaks secret patterns (SCAN_BASE limits it to SCAN_BASE..SCAN_HEAD)"
shell = "bash -euo pipefail -c"
run = '''
range=()
if [ -n "${SCAN_BASE:-}" ]; then
  range=(--log-opts "$SCAN_BASE..${SCAN_HEAD:-HEAD}")
fi
gitleaks git --no-banner --redact "${range[@]}"
'''

[tasks.scan-trufflehog]
description = "trufflehog verified live credentials (SCAN_BASE limits it to commits after SCAN_BASE)"
shell = "bash -euo pipefail -c"
run = '''
since=()
if [ -n "${SCAN_BASE:-}" ]; then
  since=(--since-commit "$SCAN_BASE")
fi
trufflehog git "file://$PWD" "${since[@]}" --branch HEAD --only-verified --fail --no-update
'''

[tasks.scan-trufflehog-report]
description = "trufflehog including unverified and unknown results, redacted to detector and location (never fails)"
shell = "bash -euo pipefail -c"
run = '''
since=()
if [ -n "${SCAN_BASE:-}" ]; then
  since=(--since-commit "$SCAN_BASE")
fi
# Raw and Redacted fields are dropped on purpose: an unverified hit may be a
# real but revoked credential, and CI logs outlive the secret's rotation.
trufflehog git "file://$PWD" "${since[@]}" --branch HEAD \
  --results=verified,unknown,unverified --json --no-update \
  | jq -r 'select(.DetectorName) | "\(.DetectorName) verified=\(.Verified) \(.SourceMetadata.Data.Git.file // "?"):\(.SourceMetadata.Data.Git.line // 0) \(.SourceMetadata.Data.Git.commit // "?")"' \
  | sort -u | tee /dev/stderr | { grep -c . || true; } | sed 's/^/findings: /'
'''

[tasks.scan-staged]
description = "gitleaks over the staged changes (the pre-commit check)"
run = "gitleaks git --staged --no-banner --redact"

[tasks.install-hooks]
description = "Install a pre-commit hook that runs gitleaks on the staged changes"
shell = "bash -euo pipefail -c"
run = '''
# The hook lives in the real git directory and calls gitleaks directly. It does
# not use core.hooksPath (a tracked hook directory would let any checked-out
# branch change what runs on your next commit) and does not run a mise task
# (that would execute whatever the checked-out mise.toml defines). It still
# reads .gitleaks.toml from the working tree, which is data, not code.
if [ -n "$(git config --get core.hooksPath || true)" ]; then
  echo "core.hooksPath is set; refusing to install. Unset it or install the hook there by hand." >&2
  exit 1
fi
hook="$(git rev-parse --git-common-dir)/hooks/pre-commit"
mkdir -p "$(dirname "$hook")"
rm -f "$hook"
cat > "$hook" <<'HOOK'
#!/usr/bin/env bash
set -euo pipefail
command -v gitleaks >/dev/null || { echo "pre-commit: gitleaks not found; run mise install" >&2; exit 1; }
exec gitleaks git --staged --no-banner --redact
HOOK
chmod +x "$hook"
echo "installed $hook"
'''
